[project]
name = "solar-violet-nodes"
version = "1.0.0"
description = "Solar Violet Nodes: typed model loaders, LoRA loader, model and LoRA browser with duplicate finder, text encoder, image tools, image to image workflow"
authors = [
    {name = "Violet Diffusion AI"}
]
license = {text = "MIT"}
dependencies = [
    "torch>=1.12.0",
    "Pillow>=8.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "black>=21.0.0",
    "flake8>=3.0.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.txt", "*.md"]

[tool.setuptools.script-installation]
# No console scripts for this package - it's a ComfyUI node package